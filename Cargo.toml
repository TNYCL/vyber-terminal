[package]
name = "vyber-terminal"
version = "0.1.0"
edition = "2024"
description = "A native terminal workspace with files, previews, and review."
license = "MIT OR Apache-2.0"
repository = "https://github.com/TNYCL/vyber-terminal"
readme = "README.md"

[[bin]]
name = "vyber"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-go", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-toml", "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html"] }
gpui = { package = "gpui-pre", version = "=0.3.7" }
alacritty_terminal = "=0.26.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
notify = "8"
ignore = "0.4"
similar = "2"
smol = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
log = "0.4"
env_logger = "0.11"
polling = "3"
url = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
